name: CI Workflow - Alisha 

on:
  push:
    branches: ["main"]
    paths:
      - 'kriteria3/**'
      - '.github/workflows/**'

permissions:
  contents: write 

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow pandas scikit-learn numpy joblib dagshub

    - name: Run mlflow project
      run: |
        mlflow run kriteria3/MLProject --env-manager=local

    - name: Find Model Path
      run: |
        # Cari path folder model di dalam mlruns (di kedalaman mana pun)
        MODEL_PATH=$(find mlruns -name "model" -type d | head -n 1)
        
        # Cek apakah ketemu
        if [ -z "$MODEL_PATH" ]; then
          echo "Error: Model tidak ditemukan!"
          exit 1
        fi

        echo "Model ditemukan di: $MODEL_PATH"
        echo "MODEL_PATH=$MODEL_PATH" >> $GITHUB_ENV

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build Docker Model
      run: |
        mlflow models build-docker --model-uri "$MODEL_PATH" --name "insurance_model" 

    - name: Tag & Push Docker Image
      run: |
        docker tag insurance_model ${{ secrets.DOCKER_HUB_USERNAME }}/insurance_model:latest
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/insurance_model:latest