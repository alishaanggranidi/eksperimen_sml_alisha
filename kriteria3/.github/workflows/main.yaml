name: CI Workflow - Alisha

on:
  push:
    branches: ["main"]
    paths:
      - 'kriteria3/**'
      - '.github/workflows/**'

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow pandas scikit-learn numpy joblib dagshub

    - name: Run mlflow project
      run: |
        mlflow run kriteria3/MLProject --env-manager=local

    - name: Get latest MLflow run_id
      run: |
        # Cari folder run terbaru berdasarkan waktu modifikasi
        RUN_ID=$(ls -td mlruns/*/*/ | head -n 1 | awk -F'/' '{print $(NF-1)}')
        
        echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
        echo "Latest run_id: $RUN_ID"

    - name: Commit & Push results
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add mlruns/
        git commit -m "Upload artifact [skip ci]" || echo "No changes to commit"
        git push origin main

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build Docker Model
      run: |
        # Kita cari path fisik folder modelnya
        MODEL_PATH=$(find mlruns -name "model" -type d | head -n 1)
        mlflow models build-docker --model-uri "$MODEL_PATH" --name "insurance_model" 

    - name: Tag & Push Docker Image
      run: |
        docker tag insurance_model ${{ secrets.DOCKER_HUB_USERNAME }}/insurance_model:latest
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/insurance_model:latest