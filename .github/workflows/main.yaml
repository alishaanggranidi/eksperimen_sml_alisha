name: CI Workflow 

on:
  push:
    branches: ["main"]
    paths:
      - 'kriteria3/**'
      - '.github/workflows/**'

permissions:
  contents: write 

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow pandas scikit-learn numpy joblib dagshub

    - name: Run mlflow project
      run: |
        mlflow run kriteria3/MLProject --env-manager=local

    - name: Build Docker Model
      run: |
        echo "Sedang mencari file MLmodel..."
        
        # Cari FILE bernama 'MLmodel' di mana pun dia sembunyi
        MLMODEL_FILE=$(find $(pwd)/mlruns -name "MLmodel" | head -n 1)

        if [ -z "$MLMODEL_FILE" ]; then
          echo "File MLmodel tidak ada."
          ls -R mlruns
          exit 1
        fi

        # Ambil nama FOLDER tempat file itu berada (dirname)
        MODEL_DIR=$(dirname "$MLMODEL_FILE")
        
        echo "Model ditemukan di: $MODEL_DIR"
        
        # Build Docker pakai alamat folder yang barusan kita temukan
        mlflow models build-docker --model-uri "$MODEL_DIR" --name "insurance_model" 

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Tag & Push Docker Image
      run: |
        docker tag insurance_model ${{ secrets.DOCKER_HUB_USERNAME }}/insurance_model:latest
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/insurance_model:latest